    --ink:#e8ecf2; --mut:#8b94a3; --faint:#616c7c;

    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}

  const kpi=(n,l,cls,sub)=>`<div class="card kpi"><div class="n ${cls||""}">${fmt(n)}</div><div class="l">${l}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;
  const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${fmt(v)}</b></div>`;
  const frow=(l,n,extra,cls)=>`<div class="frow ${cls||""}"><div class="top"><b>${l}</b><span>${fmt(n)}${extra||""}</span></div><div class="track"><i style="width:${Math.max(3,Math.round(100*n/max))}%"></i></div></div>`;
  const rows=(arr,key)=>!(arr||[]).length?'<div class="empty">Nothing yet.</div>':
    `<div class="tblwrap"><table><thead><tr><th>When</th><th>Company</th><th>Type</th><th>Summary</th></tr></thead><tbody>${arr.map(r=>`<tr><td class="lo">${r.time?esc(new Date(r.time).toLocaleString()):"—"}</td><td>${esc(r.company)}</td><td><span class="pill ${esc(r[key])}">${esc((r[key]||"").replace(/_/g," "))}</span></td><td>${esc(r.summary||"")}</td></tr>`).join("")}</tbody></table></div>`;
  $("#v-dash").innerHTML=`
    <div class="kpis">
      ${kpi(f.leads_found,"Leads discovered","acc",s.searches+" search"+(s.searches===1?"":"es"))}
      ${kpi(f.contacted,"Contacted",null,s.companies_contacted+" unique companies")}
      ${kpi(c.answered,"Picked up the phone","warn",c.answer_rate!=null?c.answer_rate+"% answer rate":"—")}
      ${kpi(f.converted,"Converted","good",cv.rate!=null?cv.rate+"% of classified calls":"—")}
    </div>
    <h2>Funnel</h2>
    <div class="card"><div class="funnel">
      ${frow("Discovered",f.leads_found)}
      ${frow("Contacted (email or call)",f.contacted)}
      ${frow("Engaged (picked up / replied)",f.engaged)}
      ${frow("Converted",f.converted,"","win")}
    </div></div>
    <h2>Breakdowns</h2>
    <div class="cols">
      <div class="card"><div class="ttl">📞 Calls</div>
        ${kv("Dialed (live)",c.dialed)}${kv("Picked up",c.answered)}${kv("Did not pick up",c.no_answer)}
        ${kv("Conversations completed",c.completed)}${kv("Spoken exchanges",c.turns)}${kv("Drafted only (dry-run)",c.prepared)}${kv("Failed to dial",c.failed)}
      </div>
      <div class="card"><div class="ttl">✉️ Emails</div>
        ${kv("Sent",em.sent)}${em.replies_tracked?kv("Replied",em.replies):""}${em.replies_tracked?kv("No response yet",em.no_response):""}
        ${kv("Drafted only (dry-run)",em.drafted)}${kv("Skipped",em.skipped)}${kv("Failed",em.failed)}
        ${em.replies_tracked?`<div class="sub"><div class="h">Reply types</div>${kv("Interested",em.reply_breakdown.interested)}${kv("Asked a question",em.reply_breakdown.question)}${kv("Follow up later",em.reply_breakdown.follow_up)}${kv("Not interested",em.reply_breakdown.not_interested)}${kv("Unsubscribed",em.reply_breakdown.opt_out)}</div>`:""}
        <div class="note">Replies are matched to sent mail by Message-ID; unsubscribes auto-add to the do-not-contact list.</div>
      </div>
      <div class="card"><div class="ttl">🎯 Call outcomes</div>
        ${kv("Converted",o.converted)}${kv("Interested",o.interested)}${kv("Follow up later",o.follow_up)}
        ${kv("Not interested",o.not_interested)}${kv("Asked not to be contacted",o.opt_out)}${kv("Unclear / cut off",o.unclear)}
        <div class="note">Every finished call's transcript is classified automatically by the model.</div>
      </div>
    </div>
    <h2>Recent call results</h2><div class="card">${rows(s.recent_outcomes,"outcome")}</div>
    <h2>Recent email replies</h2><div class="card">${rows(s.recent_replies,"classification")}</div>`;
})();

/* Leads */
(function(){
  const leads=DATA.leads;
  function analysis(ql){
    const sc=ql.score||{},l=ql.lead; let out=sc.reasoning||"";
    if(l.opportunity_summary)out+=`\n\nOPPORTUNITY: ${l.opportunity_summary}`;
    if((l.intent_signals||[]).length)out+=`\n\nINTENT SIGNALS:\n`+l.intent_signals.map(x=>"• "+x).join("\n");
    if(sc.breakdown){const b=sc.breakdown;out+=`\n\nSCORE BREAKDOWN: need ${b.need} · intent ${b.buying_intent} · budget ${b.budget} · urgency ${b.urgency} · reachable ${b.accessibility} · location ${b.location_fit} · our edge ${b.competitive_advantage}`;}
    if(sc.prediction){const p=sc.prediction;out+=`\n\nPREDICTIONS (${p.confidence} confidence): reply ${p.reply_probability}% · meeting ${p.meeting_probability}% · conversion ${p.conversion_probability}%`;
      if(p.estimated_deal_value)out+=`\nEst. deal value: ${p.estimated_deal_value}`; if(p.estimated_sales_cycle)out+=` · sales cycle: ${p.estimated_sales_cycle}`;}
    if(sc.recommended_channel)out+=`\n\nBEST FIRST TOUCH: ${sc.recommended_channel}`;
    if((sc.risks||[]).length)out+=`\n\nRISKS:\n`+sc.risks.map(x=>"• "+x).join("\n");
    return out;
  }
  $("#v-leads").innerHTML=`<div class="lead-hd">Ranked by buying probability. Expand a lead for the signal evidence, weighted score breakdown, and conversion prediction.</div>
    <div class="card"><div class="tblwrap"><table><thead><tr><th>Score</th><th>Company</th><th>Contact</th><th>Outreach</th></tr></thead><tbody>
    ${leads.map(ql=>{const l=ql.lead,s=ql.score?ql.score.score:0;const cls=s>=65?"s-hi":s>=40?"s-mid":"s-lo";
      const contact=[l.contact_name&&(l.contact_name+(l.contact_title?" · "+l.contact_title:"")),l.email,l.phone].filter(Boolean).map(esc).join("<br>")||"—";
      const outreach=(ql.outreach||[]).map(o=>{let b=`<span class="pill ${esc(o.status)}">${esc(o.channel)}: ${esc(o.status)}</span>`;
        if(o.subject||o.body)b+=`<details><summary>view draft</summary><pre>${esc(o.subject?("Subject: "+o.subject+"\n\n"):"")}${esc(o.body||"")}</pre></details>`;return b;}).join("")||'<span class="lo">below threshold</span>';
      return `<tr><td class="score ${cls}">${s}</td><td><span class="co">${esc(l.company_name)}</span><br><span class="lo">${esc(l.location||"")}${l.company_size?" · "+esc(l.company_size):""}</span><details><summary>why ${s}?</summary><pre>${esc(analysis(ql))}</pre></details></td><td style="font-size:12.5px">${contact}</td><td>${outreach}</td></tr>`;
    }).join("")}</tbody></table></div></div>`;
})();

/* Activity */
(function(){
  const chat=ts=>(ts||[]).map(m=>`<div class="tline ${m.role==="assistant"?"ta":"tu"}"><b>${m.role==="assistant"?"Agent":"Them"}</b>${esc(m.content)}</div>`).join("");
  const turn=e=>(e.user_said?`<div class="tline tu"><b>Them</b>${esc(e.user_said)}</div>`:"")+(e.agent_said?`<div class="tline ta"><b>Agent</b>${esc(e.agent_said)}</div>`:"");
  const M={
    search_started:{i:"🔎",l:e=>`Searched for <b>${esc(e.industries)}</b> in <b>${esc(e.location)}</b> — up to ${esc(e.max_leads)} leads for <b>${esc(e.product)}</b>`},
    search_completed:{i:"✅",l:e=>`Search finished — found <b>${esc(e.leads_found)}</b> lead(s)${(e.top_companies||[]).length?": "+esc(e.top_companies.join(", ")):""}`},
    email_outreach:{i:"✉️",l:e=>`${e.live?"<b>Sent</b> email":"Drafted email"} to <b>${esc(e.company)}</b>${e.to?" ("+esc(e.to)+")":""} — <span class="pill ${esc(e.status)}">${esc(e.status)}</span>${e.subject?" “"+esc(e.subject)+"”":""}`+(e.body?`<details><summary>read the full email</summary><pre>${esc(e.subject?("Subject: "+e.subject+"\n\n"):"")}${esc(e.body)}</pre></details>`:"")},
    call_placed:{i:"📞",l:e=>`${e.live?"<b>Called</b>":"Prepared call to"} <b>${esc(e.company)}</b>${e.to?" ("+esc(e.to)+")":""} — <span class="pill ${esc(e.status)}">${esc(e.status)}</span>`},
    call_started:{i:"📞",l:e=>`Call connected with <b>${esc(e.company)}</b>`+(e.opener?`<div class="tline ta"><b>Agent</b>${esc(e.opener)}</div>`:"")},
    call_turn:{i:"💬",l:e=>`On the call with <b>${esc(e.company)}</b>:`+turn(e)},
    call_ended:{i:"📴",l:e=>`Call with <b>${esc(e.company)}</b> ended — ${esc(e.reason)}`+((e.transcript||[]).length?`<details open><summary>full conversation (${e.transcript.length} messages)</summary>${chat(e.transcript)}</details>`:"")},
    call_outcome:{i:"🎯",l:e=>`Outcome for <b>${esc(e.company)}</b>: <span class="pill ${esc(e.outcome)}">${esc((e.outcome||"").replace(/_/g," "))}</span> ${esc(e.summary||"")}`},
    email_reply:{i:"📩",l:e=>`<b>${esc(e.company||e.from)}</b> replied — <span class="pill ${esc(e.classification)}">${esc((e.classification||"").replace(/_/g," "))}</span> ${esc(e.summary||"")}`+(e.body?`<details><summary>read the reply</summary><pre>${esc(e.subject?("Subject: "+e.subject+"\n\n"):"")}${esc(e.body)}</pre></details>`:"")},
    inbox_sync:{i:"📥",l:e=>`Checked the inbox — ${esc(e.checked)} new message(s), ${esc(e.new_replies)} repl${e.new_replies===1?"y":"ies"} found`},
  };
  $("#v-hist").innerHTML=`<div class="feed">${DATA.events.map(e=>{const m=M[e.event]||{i:"•",l:x=>esc(x.event)};
    return `<div class="ev"><span class="ico">${m.i}</span><div style="min-width:0"><div class="what">${m.l(e)}</div><div class="when">${e.time?esc(new Date(e.time).toLocaleString()):""}</div></div></div>`;}).join("")}</div>`;
})();
</script>
