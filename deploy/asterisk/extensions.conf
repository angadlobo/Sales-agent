; Dialplan for the sales agent.
; When ARI originates a call and the callee answers, the channel lands here
; and its audio is streamed to the self-hosted voice server over AudioSocket.
; AS_UUID and AS_SERVER are set by the originate request.

[sales-agent]
exten => agent,1,Answer()
 same => n,AudioSocket(${AS_UUID},${AS_SERVER})
 same => n,Hangup()
