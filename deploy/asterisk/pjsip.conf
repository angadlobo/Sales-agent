; SIP trunk template — fill in the values from your trunk provider
; (voip.ms, Telnyx, etc. — typically ~$1/mo for a number + ~$0.01/min).
; The section name "trunk" matches the default ARI_ENDPOINT=PJSIP/{to}@trunk.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0

[trunk]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw
outbound_auth = trunk-auth
aors = trunk-aor
from_user = YOUR_DID_OR_USERNAME

[trunk-auth]
type = auth
auth_type = userpass
username = YOUR_TRUNK_USERNAME
password = YOUR_TRUNK_PASSWORD

[trunk-aor]
type = aor
contact = sip:YOUR_PROVIDER_SIP_HOST

[trunk-registration]
type = registration
outbound_auth = trunk-auth
server_uri = sip:YOUR_PROVIDER_SIP_HOST
client_uri = sip:YOUR_TRUNK_USERNAME@YOUR_PROVIDER_SIP_HOST

; Inbound context (not used for outbound campaigns, but required to exist)
; Add handling here if you buy a number and want to receive calls.
