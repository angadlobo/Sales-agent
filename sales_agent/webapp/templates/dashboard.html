<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — AgentOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
{% include "_tailwind_config.html" %}
<style>{% include "_shell.css" %}</style>
</head>
<body class="bg-background text-on-surface font-body-base antialiased">
{% include "_sidebar.html" %}
{% include "_topbar.html" %}

<main class="ml-64 mt-16 p-margin-desktop max-w-[1440px] mx-auto min-h-screen">
  <div class="mb-8">
    <h2 class="font-display-lg text-display-lg text-on-surface mb-1">Sales Performance Dashboard</h2>
    <p class="text-secondary font-body-base">Monitoring autonomous agent outreach and pipeline health.</p>
  </div>

  <div id="content"><div class="empty-state">Loading…</div></div>
</main>

<div id="toasts" class="fixed right-4 bottom-4 flex flex-col gap-2 z-50"></div>

<script src="{{ url_for('static', filename='shell.js') }}"></script>
<script>
const $ = id => document.getElementById(id);
function esc(t){ const d=document.createElement("div"); d.textContent=(t==null?"":t); return d.innerHTML; }
const fmt = n => (n==null ? "—" : Number(n).toLocaleString());
function scoreClass(s){ return s>=65 ? "text-success" : s>=40 ? "text-warning" : "text-secondary"; }

const EV_ICON = {
  search_started: "search", search_completed: "task_alt", search_failed: "error",
  email_outreach: "mail", call_placed: "call", call_started: "call",
  call_ended: "call_end", email_reply: "forum", voice_demo_turn: "mic", inbox_sync: "inbox",
};
function eventLine(e){
  switch (e.event){
    case "search_started":   return `Searching for <b>${esc(e.industries)}</b> in <b>${esc(e.location)}</b>`;
    case "search_completed": return `Search finished — found <b>${esc(e.leads_found)}</b> lead(s)`;
    case "search_failed":    return `Search failed: ${esc(e.error)}`;
    case "email_outreach":   return `${e.live?"Sent":"Drafted"} email to <b>${esc(e.company)}</b>${e.subject?`: "${esc(e.subject)}"`:""}`;
    case "call_placed":      return `${e.live?"Called":"Prepared call to"} <b>${esc(e.company)}</b> — ${esc(e.status)}`;
    case "call_started":     return `Call connected with <b>${esc(e.company)}</b>`;
    case "call_ended":       return `Call with <b>${esc(e.company)}</b> ended (${esc(e.reason)})`;
    case "email_reply":      return `<b>${esc(e.company||e.from)}</b> replied — ${esc((e.classification||"").replace("_"," "))}`;
    case "voice_demo_turn":  return `Voice demo turn (${esc(e.company)})`;
    case "inbox_sync":       return `Checked inbox — ${esc(e.new_replies)} new repl${e.new_replies===1?"y":"ies"}`;
    default: return esc(e.event);
  }
}
function timeAgo(iso){
  if (!iso) return "";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return s+"s ago";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  if (s < 86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

function statCard(icon, label, value, sub, colorClass){
  return `
  <div class="bg-white border border-border-subtle rounded-xl p-5 flex items-center justify-between shadow-sm">
    <div>
      <p class="font-label-mono text-label-mono text-secondary mb-1">${label}</p>
      <h4 class="font-display-lg text-display-lg">${fmt(value)}</h4>
      <div class="flex items-center text-secondary text-body-sm mt-1">${esc(sub)}</div>
    </div>
    <div class="w-12 h-12 ${colorClass} rounded-full flex items-center justify-center">
      <span class="material-symbols-outlined">${icon}</span>
    </div>
  </div>`;
}

function funnelRow(label, value, max, indent, colorClasses){
  const pct = max > 0 ? Math.max(2, Math.round(100*value/max)) : 2;
  return `
  <div class="relative group cursor-default" style="margin-left:${indent}%; width:${100-indent}%">
    <div class="w-full h-14 ${colorClasses.bg} border ${colorClasses.border} rounded-lg flex items-center px-6 transition-all group-hover:brightness-95">
      <span class="font-label-mono text-label-mono ${colorClasses.text} w-28 uppercase">${esc(label)}</span>
      <div class="flex-1 h-3 ${colorClasses.track} rounded-full overflow-hidden mx-4">
        <div class="h-full ${colorClasses.bar} rounded-full" style="width:${pct}%"></div>
      </div>
      <span class="font-headline-md text-headline-md ${colorClasses.text} w-24 text-right">${fmt(value)}</span>
    </div>
  </div>`;
}

async function load(){
  let s, leadsResp, histResp;
  try {
    [s, leadsResp, histResp] = await Promise.all([
      fetch("/api/stats").then(r=>r.json()),
      fetch("/api/leads").then(r=>r.json()),
      fetch("/api/history").then(r=>r.json()),
    ]);
  } catch (e){
    $("content").innerHTML = '<div class="empty-state">Could not load dashboard data.</div>';
    return;
  }
  const f = s.funnel, c = s.calls, em = s.emails, cv = s.conversion;
  const leads = leadsResp.leads || [];
  const events = histResp.events || [];
  const anyData = f.leads_found || f.contacted || s.searches;

  if (!anyData){
    $("content").innerHTML = `
      <div class="bg-white border border-border-subtle rounded-xl p-16 text-center text-secondary">
        <span class="material-symbols-outlined text-5xl text-outline mb-3 block">rocket_launch</span>
        No activity yet — deploy an agent to find and contact your first leads.
        <div class="mt-4"><a href="/campaign" class="inline-flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg font-bold hover:opacity-90">
          <span class="material-symbols-outlined text-[18px]">add</span> Deploy New Agent
        </a></div>
      </div>`;
    return;
  }
  const max = Math.max(f.leads_found, f.contacted, f.engaged, f.converted, 1);

  // industry breakdown from real leads (for the insight card)
  const byIndustry = {};
  leads.forEach(l => {
    const ind = l.industry || "Unclassified";
    if (!byIndustry[ind]) byIndustry[ind] = {count:0, total:0};
    byIndustry[ind].count++;
    byIndustry[ind].total += (l.score||0);
  });
  const industries = Object.entries(byIndustry)
    .map(([name, v]) => ({name, count:v.count, avg: Math.round(v.total/v.count)}))
    .sort((a,b) => b.count - a.count).slice(0, 4);
  const bestIndustry = [...industries].sort((a,b)=>b.avg-a.avg)[0];

  const recentEvents = events.slice(0, 5);
  const dailyMax = Math.max(...(s.daily_activity||[]).map(d=>d.count), 1);

  $("content").innerHTML = `
    <div class="grid grid-cols-12 gap-gutter">
      <div class="col-span-12 lg:col-span-8 bg-white border border-border-subtle rounded-xl p-6 relative overflow-hidden flex flex-col">
        <div class="flex justify-between items-center mb-8 relative z-10">
          <h3 class="font-headline-md text-headline-md flex items-center">
            <span class="material-symbols-outlined mr-2 text-primary">filter_alt</span> Conversion Funnel
          </h3>
          <span class="font-label-mono text-label-mono bg-surface-container text-secondary px-2 py-1 rounded">All time</span>
        </div>
        <div class="flex-1 flex flex-col justify-center space-y-4 relative z-10">
          ${funnelRow("Leads", f.leads_found, max, 0, {bg:"bg-primary-container/10", border:"border-primary/20", text:"text-primary", track:"bg-primary/10", bar:"bg-primary"})}
          ${funnelRow("Contacted", f.contacted, max, 5, {bg:"bg-secondary-container/10", border:"border-secondary/20", text:"text-secondary", track:"bg-secondary/10", bar:"bg-secondary"})}
          ${funnelRow("Engaged", f.engaged, max, 15, {bg:"bg-ai-accent/10", border:"border-ai-accent/20", text:"text-ai-accent", track:"bg-ai-accent/10", bar:"bg-ai-accent"})}
          ${funnelRow("Converted", f.converted, max, 30, {bg:"bg-success/10", border:"border-success/20", text:"text-success", track:"bg-success/10", bar:"bg-success"})}
        </div>
      </div>

      <div class="col-span-12 lg:col-span-4 flex flex-col gap-gutter">
        ${statCard("call", "CALLS MADE", c.dialed + c.prepared, c.answered + " picked up" + (c.answer_rate!=null ? ` (${c.answer_rate}%)` : ""), "bg-primary/5 text-primary")}
        ${statCard("mail", "EMAILS SENT", em.sent + em.drafted, em.replies_tracked ? em.replies + " replies" : "reply tracking off", "bg-primary/5 text-primary")}
        ${statCard("verified", "SUCCESSFUL OUTCOMES", f.converted, cv.rate!=null ? cv.rate + "% conversion rate" : "no classified calls yet", "bg-ai-accent/5 text-ai-accent")}
      </div>

      <div class="col-span-12 bg-white border border-border-subtle rounded-xl p-6 shadow-sm">
        <div class="flex justify-between items-center mb-8">
          <div>
            <h3 class="font-headline-md text-headline-md">Daily Outreach Volume</h3>
            <p class="text-body-sm text-secondary">Emails + calls placed, last 7 days</p>
          </div>
        </div>
        <div class="h-52 w-full flex items-end justify-between px-2 pt-4 gap-2">
          ${(s.daily_activity||[]).map(d => `
            <div class="flex flex-col items-center flex-1 group relative">
              <div class="w-full max-w-[40px] ${d.count ? 'bg-primary' : 'bg-surface-container-highest'} rounded-t-lg transition-all duration-300"
                   style="height:${Math.max(4, Math.round(100*d.count/dailyMax))}%"></div>
              <span class="mt-4 font-label-mono text-label-mono text-secondary">${esc(d.label)}</span>
              <div class="absolute -top-8 left-1/2 -translate-x-1/2 bg-on-surface text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity">${fmt(d.count)}</div>
            </div>`).join("")}
        </div>
      </div>

      <div class="col-span-12 lg:col-span-7 bg-white border border-border-subtle rounded-xl overflow-hidden">
        <div class="px-6 py-4 border-b border-border-subtle bg-surface-muted/50 flex justify-between items-center">
          <h3 class="font-headline-md text-headline-md">Live Activity Feed</h3>
          <a href="/activity" class="font-label-mono text-label-mono text-primary hover:underline">View all →</a>
        </div>
        <div class="p-0">
          ${recentEvents.length ? recentEvents.map(e => `
          <div class="p-6 border-b border-border-subtle hover:bg-surface-muted transition-colors flex items-start space-x-4 last:border-b-0">
            <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0 text-primary">
              <span class="material-symbols-outlined text-[20px]">${EV_ICON[e.event] || "smart_toy"}</span>
            </div>
            <div class="flex-1">
              <div class="flex justify-between items-start mb-1">
                <p class="text-body-sm text-on-surface leading-relaxed">${eventLine(e)}</p>
                <span class="font-label-mono text-label-mono text-secondary whitespace-nowrap ml-3">${timeAgo(e.time)}</span>
              </div>
            </div>
          </div>`).join("") : '<div class="p-10 text-center text-secondary text-body-sm">No activity recorded yet.</div>'}
        </div>
      </div>

      <div class="col-span-12 lg:col-span-5 bg-white border border-border-subtle rounded-xl p-6 shadow-sm">
        <h3 class="font-headline-md text-headline-md mb-6">Leads by Industry</h3>
        <div class="space-y-6">
          ${industries.length ? industries.map(ind => `
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="font-body-base font-bold">${esc(ind.name)}</span>
              <span class="font-label-mono text-label-mono ${scoreClass(ind.avg)}">avg score ${ind.avg}</span>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
              <div class="h-full bg-primary rounded-full" style="width:${Math.min(100, ind.avg)}%"></div>
            </div>
            <div class="flex justify-between mt-1 text-[11px] text-secondary uppercase font-bold">
              <span>${ind.count} lead${ind.count===1?"":"s"}</span>
            </div>
          </div>`).join("") : '<div class="text-secondary text-body-sm">No leads discovered yet.</div>'}
        </div>
        ${bestIndustry ? `
        <div class="mt-8 p-4 bg-surface-muted rounded-lg border border-border-subtle">
          <div class="flex items-center mb-2">
            <span class="material-symbols-outlined text-primary mr-2 text-[18px]">auto_awesome</span>
            <span class="font-label-mono text-label-mono font-bold text-primary uppercase">AI Insight</span>
          </div>
          <p class="text-body-sm text-on-surface-variant"><b>${esc(bestIndustry.name)}</b> leads score highest on average (${bestIndustry.avg}/100) across ${bestIndustry.count} discovered so far.</p>
        </div>` : ""}
      </div>
    </div>`;
}
load();
</script>
</body>
</html>
